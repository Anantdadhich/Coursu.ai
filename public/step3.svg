<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#F3F4F6"/>
  
  <!-- Quiz builder interface -->
  <rect x="100" y="50" width="600" height="350" rx="8" fill="#E5E7EB"/>
  <rect x="120" y="70" width="560" height="40" rx="4" fill="#D1D5DB"/>
  <text x="140" y="95" font-family="Arial" font-size="18" font-weight="bold" fill="#4B5563">Interactive Quiz Generator</text>
  
  <!-- Question 1 -->
  <rect x="120" y="130" width="560" height="120" rx="6" fill="#D1D5DB"/>
  <text x="140" y="155" font-family="Arial" font-size="16" fill="#4B5563">Question 1: What is the main benefit of AI-powered course generation?</text>
  
  <!-- Options -->
  <circle cx="140" cy="185" r="10" fill="white" stroke="#6366F1" stroke-width="2"/>
  <text x="160" y="190" font-family="Arial" font-size="14" fill="#4B5563">Faster course creation</text>
  
  <circle cx="140" cy="215" r="10" fill="white" stroke="#6366F1" stroke-width="2"/>
  <text x="160" y="220" font-family="Arial" font-size="14" fill="#4B5563">More expensive courses</text>
  
  <circle cx="350" cy="185" r="10" fill="white" stroke="#6366F1" stroke-width="2"/>
  <text x="370" y="190" font-family="Arial" font-size="14" fill="#4B5563">Reduction in quality</text>
  
  <circle cx="350" cy="215" r="10" fill="white" stroke="#6366F1" stroke-width="2"/>
  <text x="370" y="220" font-family="Arial" font-size="14" fill="#4B5563">No benefits at all</text>
  
  <!-- Question 2 -->
  <rect x="120" y="270" width="560" height="120" rx="6" fill="#D1D5DB"/>
  <text x="140" y="295" font-family="Arial" font-size="16" fill="#4B5563">Question 2: Which technology powers Coursu's AI features?</text>
  
  <!-- Options -->
  <circle cx="140" cy="325" r="10" fill="white" stroke="#6366F1" stroke-width="2"/>
  <text x="160" y="330" font-family="Arial" font-size="14" fill="#4B5563">ChatGPT</text>
  
  <circle cx="140" cy="355" r="10" fill="#6366F1" stroke="#6366F1" stroke-width="2"/>
  <text x="160" y="360" font-family="Arial" font-size="14" fill="#4B5563">Gemini AI</text>
  
  <circle cx="350" cy="325" r="10" fill="white" stroke="#6366F1" stroke-width="2"/>
  <text x="370" y="330" font-family="Arial" font-size="14" fill="#4B5563">Claude AI</text>
  
  <circle cx="350" cy="355" r="10" fill="white" stroke="#6366F1" stroke-width="2"/>
  <text x="370" y="360" font-family="Arial" font-size="14" fill="#4B5563">DALL-E</text>
  
  <!-- Controls -->
  <rect x="550" y="400" width="120" height="35" rx="17.5" fill="#6366F1"/>
  <text x="585" y="423" font-family="Arial" font-size="14" fill="white" font-weight="bold">Next</text>
  
  <!-- Progress bar -->
  <rect x="120" y="400" width="400" height="10" rx="5" fill="#D1D5DB"/>
  <rect x="120" y="400" width="150" height="10" rx="5" fill="#6366F1"/>
  <text x="120" y="425" font-family="Arial" font-size="12" fill="#4B5563">2 of 5 questions</text>
</svg> 