<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#F3F4F6"/>
  
  <!-- YouTube video panel -->
  <rect x="80" y="60" width="320" height="180" rx="8" fill="#E5E7EB"/>
  <rect x="90" y="70" width="300" height="160" rx="4" fill="#D1D5DB"/>
  <polygon points="220,120 220,180 260,150" fill="#EF4444"/>
  <rect x="150" y="200" width="180" height="30" rx="4" fill="#9CA3AF"/>
  <text x="170" y="220" font-family="Arial" font-size="14" fill="white">YouTube Video</text>
  
  <!-- AI Processing visualization -->
  <rect x="450" y="80" width="260" height="140" rx="8" fill="#E5E7EB"/>
  <circle cx="580" cy="150" r="50" fill="#8B5CF6" fill-opacity="0.3"/>
  <circle cx="580" cy="150" r="35" fill="#8B5CF6" fill-opacity="0.5"/>
  <circle cx="580" cy="150" r="20" fill="#8B5CF6" fill-opacity="0.7"/>
  <text x="550" y="70" font-family="Arial" font-size="14" fill="#4B5563">AI Processing</text>
  
  <!-- Connection line -->
  <line x1="400" y1="150" x2="450" y2="150" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- Results -->
  <rect x="100" y="270" width="600" height="140" rx="8" fill="#E5E7EB"/>
  
  <!-- Summary section -->
  <rect x="120" y="290" width="270" height="100" rx="4" fill="#D1D5DB"/>
  <text x="210" y="310" font-family="Arial" font-size="14" font-weight="bold" fill="#4B5563">Video Summary</text>
  <rect x="140" y="320" width="230" height="8" rx="2" fill="#9CA3AF"/>
  <rect x="140" y="335" width="230" height="8" rx="2" fill="#9CA3AF"/>
  <rect x="140" y="350" width="180" height="8" rx="2" fill="#9CA3AF"/>
  <rect x="140" y="365" width="210" height="8" rx="2" fill="#9CA3AF"/>
  
  <!-- Quiz section -->
  <rect x="410" y="290" width="270" height="100" rx="4" fill="#D1D5DB"/>
  <text x="520" y="310" font-family="Arial" font-size="14" font-weight="bold" fill="#4B5563">AI-Generated Quiz</text>
  <rect x="430" y="325" width="230" height="20" rx="3" fill="#9CA3AF"/>
  <circle cx="445" cy="355" r="7" fill="#9CA3AF"/>
  <rect x="460" y="350" width="100" height="10" rx="2" fill="#9CA3AF"/>
  <circle cx="445" cy="375" r="7" fill="#9CA3AF"/>
  <rect x="460" y="370" width="120" height="10" rx="2" fill="#9CA3AF"/>
</svg> 